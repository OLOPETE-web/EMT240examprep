<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMT 240 EXAM PREP - NEMTSA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: #FFD700;
            color: #333;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .landing {
            background: #FFD700;
            padding: 30px 20px;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            width: 180px;
            height: 180px;
            margin: 0 auto 20px;
            border-radius: 0%;
            background: #118007;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .title {
            color: #004d00;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .subtitle {
            color: white;
            font-size: 24px;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .btn {
            background: #004d00bb;
            color: white;
            padding: 16px 40px;
            font-size: 20px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn:hover {
            background: #006600;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="landing" id="landing">
            <div class="logo">
                <img src="EMT240.png" alt="NEMTSA Logo">
            </div>
            <h1 class="title">EMT 240 EXAM PREP</h1>
            <p class="subtitle">Practice CBT questions for all your courses this semester and ace your exams</p>
            <button class="btn" onclick="startQuiz()">Get Started</button>
        </div>
    </div>

    <script>
        function startQuiz() {
            // Add your quiz start logic here
            window.location.href = 'dashboard.html'; // Redirect to quiz page
        }
    </script>
</body>
</html>
